<!-- MODAL 5: PENGATURAN TOKO & PROFIL PERUSAHAAN -->
<div id="modal-store-settings" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto no-print">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden my-8 transform transition-all">
        <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-store text-sky-400"></i>
                <h3 class="font-bold text-base">Pengaturan Profil Toko & Kasir</h3>
            </div>
            <button onclick="closeStoreSettingsModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
        </div>

        <form id="form-store-settings" onsubmit="saveStoreSettings(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto custom-scrollbar">
            <!-- Informasi Toko -->
            <div class="space-y-3">
                <h4 class="text-xs font-bold uppercase text-sky-600 tracking-wider">Identitas Toko</h4>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Toko / Perusahaan *</label>
                    <input type="text" id="setting-store-name" required placeholder="Contoh: Toko Berkah Jaya" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Alamat Lengkap Toko *</label>
                    <textarea id="setting-store-address" rows="2" required placeholder="Jl. Utama No. 123..." class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor Telp / WhatsApp *</label>
                    <input type="text" id="setting-store-phone" required placeholder="0812-3456-7890" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
            </div>

            <!-- Pengaturan Kasir & Struk -->
            <div class="space-y-3 pt-3 border-t border-slate-100">
                <h4 class="text-xs font-bold uppercase text-sky-600 tracking-wider">Kasir & Struk Belanja</h4>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Kasir Aktif *</label>
                    <input type="text" id="setting-store-cashier" required placeholder="Contoh: Kasir Utama / Ahmad" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Pesan Tambahan di Struk (Footer)</label>
                    <input type="text" id="setting-store-footer" placeholder="Terima kasih atas kunjungan Anda!" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
            </div>

            <!-- Pengaturan Pembayaran (Rekening & QRIS) -->
            <div class="space-y-3 pt-3 border-t border-slate-100">
                <h4 class="text-xs font-bold uppercase text-sky-600 tracking-wider">Info Transfer & QRIS</h4>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Bank</label>
                        <input type="text" id="setting-bank-name" placeholder="BCA / Mandiri" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor Rekening</label>
                        <input type="text" id="setting-bank-account" placeholder="123-456-7890" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Atas Nama Rekening (A.N)</label>
                    <input type="text" id="setting-bank-owner" placeholder="Nama Pemilik Rekening" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">URL Gambar Barcode QRIS Toko (Opsional)</label>
                    <input type="url" id="setting-qris-image" placeholder="https://domain.com/qris-toko.png" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    <p class="text-[10px] text-slate-400 mt-1">Kosongkan jika ingin sistem men-generate QR Code dinamis otomatis.</p>
                </div>
            </div>

            <div class="pt-3 flex gap-3">
                <button type="submit" class="flex-1 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-sm transition shadow-sm">
                    Simpan Pengaturan
                </button>
                <button type="button" onclick="closeStoreSettingsModal()" class="px-5 py-3 border border-slate-300 text-slate-600 font-semibold rounded-xl text-sm hover:bg-slate-50">
                    Batal
                </button>
            </div>
        </form>
    </div>
</div>
